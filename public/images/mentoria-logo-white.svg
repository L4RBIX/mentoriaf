<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" fill="white">
  <!-- graduation cap board (rounded rect, slight tilt) -->
  <rect x="14" y="6" width="76" height="33" rx="11" transform="rotate(-3 52 22)"/>

  <!-- tassel arm: right corner → right → down -->
  <path d="M84 20 L93 20 Q97 20 97 25 L97 44"
        stroke="white" stroke-width="4.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tassel bob -->
  <rect x="91" y="43" width="10" height="13" rx="3.5"/>

  <!-- book left page -->
  <path d="M52 47
           Q38 45 24 49
           Q13 53 12 67
           Q11 80 20 85
           Q34 89 52 80 Z"/>

  <!-- book right page -->
  <path d="M58 47
           Q72 45 86 49
           Q97 53 98 67
           Q99 80 90 85
           Q76 89 58 80 Z"/>

  <!-- spine V-notch (cut out) -->
  <path d="M45 47 L55 65 L65 47" fill="#0a0a0a"/>
</svg>
